[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "accessforge-api"
version = "0.1.0"
requires-python = ">=3.11"
# Architecture-selected HTTP, validated settings, ORM, spatial types, migrations and PostgreSQL driver.
# accessforge-engine is the repository's own optimization package; the planning adapter calls it in-process.
dependencies = [
  "accessforge-engine",
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.1,<3", "geoalchemy2>=0.15,<1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
# HTTPX drives ASGI tests; remaining tools enforce coverage, lint and typing.
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.uv.sources]
accessforge-engine = { path = "../engine", editable = true }

[tool.setuptools.packages.find]
include = ["accessforge_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=accessforge_api --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: requires an explicit TEST_DATABASE_URL pointing to PostGIS"]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
# The editable engine ships no py.typed marker; read its typed source directly.
mypy_path = "../engine"
plugins = ["pydantic.mypy"]
# The engine is type-checked with its own stubs in services/engine.
[[tool.mypy.overrides]]
module = "accessforge_engine.*"
follow_imports = "silent"
# networkx ships no stubs here; the engine pins types-networkx for its own checks.
[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true
