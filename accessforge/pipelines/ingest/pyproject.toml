[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "accessforge-ingest"
version = "0.1.0"
requires-python = ">=3.11"
# accessforge-api owns the schema and migrations this pipeline writes into.
# networkx is the project's chosen graph library; used here only for the connectivity check.
dependencies = ["accessforge-api", "networkx>=3.4,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-networkx"]

[project.scripts]
accessforge-ingest = "accessforge_ingest.cli:main"

[tool.uv.sources]
accessforge-api = { path = "../../services/api", editable = true }
accessforge-engine = { path = "../../services/engine", editable = true }

[tool.setuptools.packages.find]
include = ["accessforge_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=accessforge_ingest --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: requires TEST_DATABASE_URL pointing to PostGIS"]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
mypy_path = "../../services/api:../../services/engine"
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["accessforge_engine.*", "accessforge_api.*"]
follow_imports = "silent"
