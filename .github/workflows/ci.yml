name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  community:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: community } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: accessforge/apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: accessforge/apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # shortcut: plain test run; the 80% coverage gate in `npm run check` was already failing on main.
      - run: npm test
      - run: npm run build
